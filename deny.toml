[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]

[advisories]
version = 2
yanked = "deny"
# These informational notices describe crates merged into zbus 6, not known
# vulnerabilities. Released AccessKit/AT-SPI dependencies still require zbus 5
# (checked 2026-10-21), including the latest published GUI dependency versions.
# https://github.com/z-galaxy/zbus/issues/2043
# Remove these exceptions after the upstream accessibility stack migrates.
# Stale exceptions fail the audit; all other advisories remain checked.
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "Informational zvariant deprecation after its merge into zbus 6; required by the released AccessKit/AT-SPI stack. Remove after upstream migration." },
    { id = "RUSTSEC-2026-0371", reason = "Informational zbus_names deprecation after its merge into zbus 6; required by the released AccessKit/AT-SPI stack. Remove after upstream migration." },
    { id = "RUSTSEC-2026-0372", reason = "Informational zvariant_derive deprecation after its merge into zbus 6; required by the released AccessKit/AT-SPI stack. Remove after upstream migration." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "MIT-0",
    # Шрифты из графа egui (epaint_default_fonts): Hack, Noto Emoji.
    "OFL-1.1",
    # Шрифт Ubuntu-Light оттуда же.
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.8
# Пока зависимостей нет, любая строка allow — «unmatched»; warn вместо deny,
# чтобы скелет проходил. Список не урезать: он нужен, как только появятся deps.
unused-allowed-license = "warn"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
