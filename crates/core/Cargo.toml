[package]
name = "panzir-core"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Core logic for panzir — LUKS2 vault manager over udisks2 (no GUI, no root)"

[lints]
workspace = true

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
thiserror = "2"
secrecy = "0.10"
zeroize = "1"
tracing = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
